name: Build llama.cpp CUDA 11.8 for V100

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or tag to build'
        required: false
        default: 'master'

jobs:
  build-windows-cuda-11-8:
    runs-on: windows-2022

    steps:
      - name: Install CUDA Toolkit 11.8
        uses: Jimver/cuda-toolkit@v0.2.19
        id: cuda-toolkit
        with:
          cuda: '11.8.0'
          method: 'network'

      - name: Verify CUDA
        run: |
          nvcc --version
          echo "CUDA_PATH: $env:CUDA_PATH"

      - name: Patch MSVC STL for CUDA 11.8 compatibility
        run: |
          $msvcBase = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC"
          $headers = Get-ChildItem -Path $msvcBase -Recurse -Filter "yvals_core.h"
          foreach ($header in $headers) {
            Write-Host "Patching: $($header.FullName)"
            (Get-Content $header.FullName) | ForEach-Object {
              $_ -replace '_EMIT_STL_ERROR\(STL1002,.*\)', '/* patched for CUDA 11.8 */'
            } | Set-Content $header.FullName
          }
          Write-Host "Patched $($headers.Count) file(s)"

      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Configure CMake
        run: |
          cmake -B build `
            -DGGML_CUDA=ON `
            -DGGML_CUDA_FA_ALL_QUANTS=ON `
            -DCMAKE_CUDA_ARCHITECTURES=70 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CUDA_FLAGS="-allow-unsupported-compiler"

      - name: Build
        run: |
          cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS

      - name: Collect artifacts
        run: |
          New-Item -ItemType Directory -Force -Path artifact
          # Copy exe files
          Copy-Item build/bin/Release/*.exe artifact/ -ErrorAction SilentlyContinue
          Copy-Item build/bin/*.exe artifact/ -ErrorAction SilentlyContinue
          # Copy DLL files (ggml, llama, cuda runtime)
          Copy-Item build/bin/Release/*.dll artifact/ -ErrorAction SilentlyContinue
          Copy-Item build/bin/*.dll artifact/ -ErrorAction SilentlyContinue
          # Copy CUDA runtime DLLs
          Copy-Item "$env:CUDA_PATH/bin/cudart64_*.dll" artifact/ -ErrorAction SilentlyContinue
          Copy-Item "$env:CUDA_PATH/bin/cublas64_*.dll" artifact/ -ErrorAction SilentlyContinue
          Copy-Item "$env:CUDA_PATH/bin/cublasLt64_*.dll" artifact/ -ErrorAction SilentlyContinue
          # List files
          Get-ChildItem artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-win-cuda-11.8-sm70
          path: artifact/
          retention-days: 30
